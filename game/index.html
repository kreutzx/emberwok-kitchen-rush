<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwok: Harbor Kitchen Rush</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #17100b;
    overflow: hidden;
  }
  #game {
    position: fixed;
    display: block;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="960"></canvas>
<div id="status" role="status" aria-live="polite">Emberwok: Harbor Kitchen Rush</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
